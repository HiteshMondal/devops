apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devops-app-netpol
  namespace: devops-app
spec:
  podSelector:
    matchLabels:
      app: devops-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  # NOTE: namespaceSelector: {} only matches pods in in-cluster namespaces.
  # If DB_HOST points to a managed/external database (RDS, Cloud SQL, etc.)
  # instead of an in-cluster Service, add an `ipBlock` egress rule for that
  # DB's CIDR/port here.
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
