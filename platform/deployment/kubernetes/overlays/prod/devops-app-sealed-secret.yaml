apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: devops-app-secrets
  namespace: devops-app
  labels:
    app: devops-app
spec:
  encryptedData:
    DB_USERNAME: 
    DB_PASSWORD: 
    JWT_SECRET: 
    API_KEY: 
    SESSION_SECRET: 
    REDIS_URL: 
    MONGO_URL: 

  template:
    metadata:
      name: devops-app-secrets
      namespace: devops-app
      labels:
        app: devops-app
    type: Opaque
