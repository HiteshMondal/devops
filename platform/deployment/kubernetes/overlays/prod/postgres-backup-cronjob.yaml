apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: devops-app
  labels: {app: postgres-backup}
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels: {app: postgres-backup}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: postgres-backup-sa
          securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999}
          volumes:
            - {name: work, emptyDir: {}}
          initContainers:
            - name: dump
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  pg_dump -h "$DB_HOST" -p "$DB_PORT" -U "$PGUSER" -d "$DB_NAME" -f /work/dump.sql
                  gzip -f /work/dump.sql
              envFrom:
                - configMapRef: {name: devops-app-config}   # DB_HOST, DB_PORT, DB_NAME, PGSSLMODE
              env:
                - {name: PGUSER, valueFrom: {secretKeyRef: {name: devops-app-secrets, key: DB_USERNAME}}}
                - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: devops-app-secrets, key: DB_PASSWORD}}}
              volumeMounts: [{name: work, mountPath: /work}]
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          containers:
            - name: upload
              image: amazon/aws-cli:2.17.62
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  aws s3 cp /work/dump.sql.gz "s3://${BACKUP_BUCKET}/postgres/$(date -u +%Y%m%d-%H%M%S).sql.gz"
              envFrom:
                - configMapRef: {name: devops-app-config}   # BACKUP_BUCKET
              env: [{name: HOME, value: /tmp}]
              volumeMounts: [{name: work, mountPath: /work}]
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup-sa
  namespace: devops-app
  labels: {app: postgres-backup}
  annotations:
    eks.amazonaws.com/role-arn: "placeholder-overridden-by-backup-config-patch"
