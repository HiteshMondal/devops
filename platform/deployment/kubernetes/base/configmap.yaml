apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-app-config
  namespace: devops-app
  labels:
    app: devops-app
data:
  APP_ENV: "production"
  DB_SQLITE_PATH: "/data/app.db"
  LOG_LEVEL: "INFO"
  MAX_CONCURRENT_DEPLOYMENTS: "3"
  RATE_LIMIT_PER_MINUTE: "60"
  LRU_CACHE_SIZE: "128"
  CB_FAILURE_THRESHOLD: "5"
  CB_RESET_SECONDS: "30"
