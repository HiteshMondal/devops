apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-app-config
  namespace: devops-app
  labels:
    app: devops-app
data:
  APP_ENV: "production"
  DB_SQLITE_PATH: "/data/app.db"
  LOG_LEVEL: "info"
  CB_FAILURE_THRESHOLD: "5"
  CB_RESET_SECONDS: "30"
  REDIS_URL: "redis://redis-service:6379/0"
  MONGO_URL: "mongodb://mongo-service:27017"
  MONGO_DB: "devopsapp"
