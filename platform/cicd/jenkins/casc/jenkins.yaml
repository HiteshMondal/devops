# Jenkins Configuration as Code (JCasC)

jenkins:
  systemMessage: "DevOps Platform — Jenkins (managed by Configuration as Code; do not edit via UI)"
  numExecutors: 2
  mode: NORMAL
  remotingSecurity:
    enabled: true
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: false

security:
  apiToken:
    creationOfLegacyTokenEnabled: false
    tokenGenerationOnCreationEnabled: false
  sSHD:
    port: -1

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8090/}"
  timestamperConfig:
    allPipelines: true

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-credentials"
              username: "${DOCKERHUB_USERNAME:-}"
              password: "${DOCKERHUB_PASSWORD:-}"
              description: "DockerHub registry credentials (from .env / jenkins.env)"

          - usernamePassword:
              scope: GLOBAL
              id: "github-credentials"
              username: "${GITHUB_USERNAME:-}"
              password: "${GITHUB_TOKEN:-}"
              description: "GitHub username + personal access token (from .env / jenkins.env)"

          - string:
              scope: GLOBAL
              id: "github-token"
              secret: "${GITHUB_TOKEN:-}"
              description: "GitHub PAT, single-value form (from .env / jenkins.env)"

          - string:
              scope: GLOBAL
              id: "aws-access-key-id"
              secret: "${AWS_ACCESS_KEY_ID:-}"
              description: "AWS access key (from .env / jenkins.env / secrets manager)"

          - string:
              scope: GLOBAL
              id: "aws-secret-access-key"
              secret: "${AWS_SECRET_ACCESS_KEY:-}"
              description: "AWS secret key (from .env / jenkins.env / secrets manager)"

          - string:
              scope: GLOBAL
              id: "argocd-admin-password"
              secret: "${ARGOCD_ADMIN_PASSWORD:-}"
              description: "ArgoCD admin password (from .env / jenkins.env)"

          - file:
              scope: GLOBAL
              id: "kubeconfig"
              fileName: "kubeconfig"
              secretBytes: "${KUBECONFIG_CONTENTS_BASE64:-}"
              description: "kubeconfig for the target cluster, base64-encoded (from jenkins.env — see scripts/configure_jenkins.sh)"

# Job seeding
jobs:
  - script: |
      pipelineJob('devops-platform-pipeline') {
        description('Main DevOps Platform CI/CD pipeline: test, build, scan, deploy. Defined in platform/cicd/jenkins/pipelines/Jenkinsfile.')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url(System.getenv('GIT_REPO_URL') ?: '')
                  credentials('github-credentials')
                }
                branch("*/${System.getenv('GIT_REPO_BRANCH') ?: 'main'}")
              }
            }
            scriptPath('platform/cicd/jenkins/pipelines/Jenkinsfile')
          }
        }
        triggers {
          githubPush()
          cron('H/2 * * * *')
        }
      }

      pipelineJob('devops-platform-infra-pipeline') {
        description('Infrastructure provisioning pipeline (Terraform / OpenTofu / Pulumi), manual trigger. Defined in platform/cicd/jenkins/pipelines/Jenkinsfile.infra.')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url(System.getenv('GIT_REPO_URL') ?: '')
                  credentials('github-credentials')
                }
                branch("*/${System.getenv('GIT_REPO_BRANCH') ?: 'main'}")
              }
            }
            scriptPath('platform/cicd/jenkins/pipelines/Jenkinsfile.infra')
          }
        }
      }
