config:
  azure-native:location: eastus
  # Everything below is optional — if omitted, values fall back to .env,
  # then to the built-in defaults in __main__.py. Uncomment to pin a value
  # for this stack specifically without touching .env or the code.
  # devops-platform-azure:AZURE_LOCATION: eastus
  # devops-platform-azure:AZURE_AKS_VM_SIZE: Standard_B2s
  # devops-platform-azure:AZURE_AKS_NODE_COUNT: "1"
  # devops-platform-azure:AZURE_POSTGRES_SKU: Standard_B1ms
  # devops-platform-azure:AZURE_POSTGRES_STORAGE_GB: "32"
  # devops-platform-azure:AZURE_POSTGRES_VERSION: "16"
  #
  # Secrets (DB_PASSWORD etc.) should NOT be pinned here in plaintext.
  # Prefer either:
  #   pulumi config set --secret DB_PASSWORD '...'
  # or let it be picked up from the project .env (already gitignored).
