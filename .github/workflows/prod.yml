########################################################################
# .github/workflows/prod.yml — Production-grade CI (validation only)
#
# This is CI, not CD: nothing is deployed, applied, or pushed anywhere.
# It only lints, builds, and validates — so it never needs cloud
# credentials and never provisions billable resources.
#
# Zero-cost design:
#   - Only ubuntu-latest GitHub-hosted runners (free for public repos,
#     covered by included minutes on private repos).
#   - No self-hosted runners, no cloud API calls (terraform/tofu use
#     `init -backend=false` + `validate`/`fmt` — no AWS/OCI/Azure creds).
#   - Docker images are built locally (`push: false`) and scanned,
#     never pushed to a registry.
#   - Dependency + Docker layer caching (actions/setup-python cache,
#     type=gha buildx cache) to keep runs short.
#   - concurrency cancels superseded runs; every job has a timeout so a
#     stuck step can't burn minutes indefinitely.
#   - Doc-only changes don't trigger a run.
#
# Environment variables:
#   Every job that needs config values sources them from the repo's
#   .env (if committed, e.g. on a self-hosted/private fork) or falls
#   back to .env.example (the template checked into the repo) — never
#   hardcoded in this file. Real secrets (DOCKERHUB_PASSWORD,
#   GITHUB_TOKEN, JWT_SECRET, etc.) are never required because CI never
#   pushes images or talks to a live cluster/cloud account.
########################################################################

name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "monitoring/documentation.md"
      - "platform/cicd/CICD_Documentation.md"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # Load .env (or .env.example) once, expose values to later jobs
  load-env:
    name: Load .env
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_name: ${{ steps.dotenv.outputs.app_name }}
      namespace: ${{ steps.dotenv.outputs.namespace }}
      app_port: ${{ steps.dotenv.outputs.app_port }}
      env_source: ${{ steps.resolve.outputs.file }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve which env file to use
        id: resolve
        run: |
          set -euo pipefail
          if [[ -f .env ]]; then
            echo "file=.env" >> "$GITHUB_OUTPUT"
          elif [[ -f .env.example ]]; then
            echo "file=.env.example" >> "$GITHUB_OUTPUT"
            echo "::notice::No .env committed — using .env.example defaults for CI"
          else
            echo "::error::Neither .env nor .env.example found at repo root"
            exit 1
          fi

      - name: Export values needed by later jobs
        id: dotenv
        run: |
          set -a
          # shellcheck disable=SC1090
          source "${{ steps.resolve.outputs.file }}"
          set +a
          {
            echo "app_name=${APP_NAME:-devops-app}"
            echo "namespace=${NAMESPACE:-devops-app}"
            echo "app_port=${APP_PORT:-8000}"
          } >> "$GITHUB_OUTPUT"

  # Shell scripts
  shellcheck:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Run shellcheck on every *.sh file
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name "*.sh" -not -path "./.git/*")
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No shell scripts found"
            exit 0
          fi
          shellcheck -S warning "${files[@]}"

  # YAML syntax/style
  yamllint:
    name: Lint YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yamllint
      - name: yamllint
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f \( -name "*.yml" -o -name "*.yaml" \) -not -path "./.git/*")
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}" "${files[@]}"

  # Python app: lint, compile, tests
  python-app:
    name: Python App — Lint & Test
    runs-on: ubuntu-latest
    needs: load-env
    timeout-minutes: 10
    env:
      APP_NAME: ${{ needs.load-env.outputs.app_name }}
      APP_PORT: ${{ needs.load-env.outputs.app_port }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Ruff lint
        working-directory: app
        run: ruff check src

      - name: Byte-compile check
        working-directory: app
        run: python -m py_compile $(find src -name "*.py")

      - name: Run tests (if any exist)
        working-directory: app
        run: |
          if find . -type f -name "test_*.py" -o -type f -name "*_test.py" | grep -q .; then
            pytest -q
          else
            echo "No tests found — skipping pytest"
          fi

  # Docker: build locally + vulnerability scan, never push
  docker-build:
    name: Docker Build & Scan (no push)
    runs-on: ubuntu-latest
    needs: load-env
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build app image (local only)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          load: true
          tags: ${{ needs.load-env.outputs.app_name }}:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Scan app image (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.load-env.outputs.app_name }}:ci
          format: table
          exit-code: "0"
          severity: LOW,MEDIUM,HIGH,CRITICAL

      - name: Gate on CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.load-env.outputs.app_name }}:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build Trivy exporter image (validate only)
        uses: docker/build-push-action@v6
        with:
          context: ./monitoring/trivy
          push: false
          cache-from: type=gha,scope=trivy-exporter
          cache-to: type=gha,mode=max,scope=trivy-exporter

      - name: Build Trivy runner image (validate only)
        uses: docker/build-push-action@v6
        with:
          context: ./monitoring/trivy/trivy-runner
          push: false
          cache-from: type=gha,scope=trivy-runner
          cache-to: type=gha,mode=max,scope=trivy-runner

  # Kubernetes manifests: fully offline, no live cluster needed
  kubernetes-validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: load-env
    timeout-minutes: 10
    env:
      APP_NAME: ${{ needs.load-env.outputs.app_name }}
      NAMESPACE: ${{ needs.load-env.outputs.namespace }}
      APP_PORT: ${{ needs.load-env.outputs.app_port }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Render every Kustomize overlay (offline)
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered
          find . -type f -name kustomization.yaml -not -path "./.git/*" | while read -r kfile; do
            dir="$(dirname "$kfile")"
            slug="$(echo "$dir" | tr '/.' '__')"
            echo "== Rendering ${dir} =="
            if kubectl kustomize "$dir" > "/tmp/rendered/${slug}.yaml" 2> "/tmp/rendered/${slug}.err"; then
              echo "OK: ${dir}"
            else
              # Some overlays (e.g. app deployment overlays) only become
              # fully valid once deploy_kubernetes.sh generates its
              # runtime patch files — that's expected pre-deploy, so warn
              # instead of failing the whole job.
              echo "::warning::Could not render ${dir} standalone (likely needs runtime-generated patches)"
              cat "/tmp/rendered/${slug}.err"
              rm -f "/tmp/rendered/${slug}.yaml"
            fi
          done

      - name: Render standalone manifests (envsubst from .env)
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          source "${{ needs.load-env.outputs.env_source }}"
          set +a
          mkdir -p /tmp/rendered
          for dir in monitoring/prometheus monitoring/grafana monitoring/loki monitoring/trivy platform/deployment/kubernetes/base; do
            [[ -d "$dir" ]] || continue
            find "$dir" -maxdepth 1 -type f \( -name "*.yaml" -o -name "*.yml" \) ! -name "kustomization.yaml" ! -name "alerts.yaml" | while read -r f; do
              slug="$(echo "$f" | tr '/.' '__')"
              envsubst < "$f" > "/tmp/rendered/${slug}.yaml"
            done
          done

      - name: Validate all rendered manifests against Kubernetes schemas
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(/tmp/rendered/*.yaml)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No manifests were rendered — nothing to validate"
            exit 1
          fi
          # -ignore-missing-schemas: skip CRDs (ArgoCD Application, etc.)
          # since no cluster/CRD registry is available offline.
          kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.30.0 "${files[@]}"

  # Terraform (AWS) — no AWS credentials used
  terraform-validate:
    name: Terraform Validate (AWS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: terraform fmt -check
        working-directory: platform/infra/terraform
        run: terraform fmt -check -recursive
      - name: terraform init (no backend, no state, no creds)
        working-directory: platform/infra/terraform
        run: terraform init -backend=false -upgrade
      - name: terraform validate
        working-directory: platform/infra/terraform
        run: terraform validate

  # OpenTofu (OCI) — no OCI credentials used
  opentofu-validate:
    name: OpenTofu Validate (OCI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - name: tofu fmt -check
        working-directory: platform/infra/OpenTofu
        run: tofu fmt -check -recursive
      - name: tofu init (no backend, no state, no creds)
        working-directory: platform/infra/OpenTofu
        run: tofu init -backend=false -upgrade
      - name: tofu validate
        working-directory: platform/infra/OpenTofu
        run: tofu validate

  # Pulumi (Azure) — syntax-checked only, no Azure login/cost
  pulumi-validate:
    name: Pulumi Validate (Azure)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: platform/infra/Pulumi/requirements.txt
      - name: Install Pulumi program dependencies
        working-directory: platform/infra/Pulumi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Byte-compile Pulumi program
        working-directory: platform/infra/Pulumi
        run: python -m py_compile __main__.py

  # Single required status check for branch protection
  ci-success:
    name: CI Success
    if: always()
    needs:
      - load-env
      - shellcheck
      - yamllint
      - python-app
      - docker-build
      - kubernetes-validate
      - terraform-validate
      - opentofu-validate
      - pulumi-validate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any dependent job failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
